# ==============================================================================
# LogPilot — Core Infrastructure Docker Compose
# Services: Elasticsearch, Kibana, Apache Kafka (KRaft), Redis
# Profiles: full (16 GB RAM), lite (8 GB RAM)
# ==============================================================================

networks:
  logpilot-network:
    name: logpilot-network
    driver: bridge

volumes:
  esdata:
    driver: local
  kafkadata:
    driver: local
  kibanadata:
    driver: local
  redisdata:
    driver: local
  filebeatdata:
    driver: local
  sparkstate:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # Elasticsearch 8.x: Search Engine & Vector Store
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:${ELASTIC_VERSION:-8.11.0}
    container_name: logpilot-elasticsearch
    profiles:
      - full
      - lite
    environment:
      - node.name=elasticsearch
      - cluster.name=logpilot-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=basic
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${ES_MEM_LIMIT:-3g}
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT:-3g}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - logpilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Kibana 8.x: Log & Metrics Visualization Dashboards
  # ----------------------------------------------------------------------------
  kibana:
    image: kibana:${ELASTIC_VERSION:-8.11.0}
    container_name: logpilot-kibana
    profiles:
      - full
      - lite
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_MONITORING_COLLECTION_ENABLED=true
    mem_limit: ${KIBANA_MEM_LIMIT:-1g}
    deploy:
      resources:
        limits:
          memory: ${KIBANA_MEM_LIMIT:-1g}
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    volumes:
      - kibanadata:/usr/share/kibana/data
    networks:
      - logpilot-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601/api/status | grep -q 'HTTP/1.1 200 OK\\|HTTP/1.1 302'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Apache Kafka (KRaft mode): Streaming Message Backbone
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logpilot-kafka
    profiles:
      - full
      - lite
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: '4L62EnnTTAhumZomngEQTQ'
      KAFKA_JVM_PERFORMANCE_OPTS: '-server -XX:+UseG1GC'
      KAFKA_HEAP_OPTS: '-Xms512m -Xmx512m'
    mem_limit: ${KAFKA_MEM_LIMIT:-1g}
    deploy:
      resources:
        limits:
          memory: ${KAFKA_MEM_LIMIT:-1g}
    ports:
      - "127.0.0.1:9092:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - logpilot-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Redis: Speed Layer (Counters, Active Incidents, Semantic Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: logpilot-redis
    profiles:
      - full
      - lite
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-256m}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - logpilot-network
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
          else
            redis-cli ping | grep -q PONG
          fi
        '
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # One-shot init: Kafka topics (partitions/retention per the data model)
  # ----------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logpilot-kafka-init
    profiles: [full, lite]
    entrypoint: ["bash", "/scripts/create_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./ingestion/kafka/create_topics.sh:/scripts/create_topics.sh:ro
    networks: [logpilot-network]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # ----------------------------------------------------------------------------
  # One-shot init: Elasticsearch ILM policy, ingest pipeline, index template
  # ----------------------------------------------------------------------------
  es-init:
    image: curlimages/curl:8.5.0
    container_name: logpilot-es-init
    profiles: [full, lite]
    entrypoint: ["sh", "/setup/setup.sh"]
    environment:
      ES_URL: http://elasticsearch:9200
    volumes:
      - ./storage/elasticsearch:/setup:ro
    networks: [logpilot-network]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  # ----------------------------------------------------------------------------
  # Filebeat: tails ./logs (replay + shop output) -> Kafka logs.raw
  # ----------------------------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.11.0}
    container_name: logpilot-filebeat
    profiles: [full, lite]
    user: root
    # strict.perms off: Windows bind mounts show the config as world-writable.
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      KAFKA_INTERNAL_BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: ${FILEBEAT_MEM_LIMIT:-256m}
    volumes:
      - ./ingestion/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro
      - filebeatdata:/usr/share/filebeat/data
    networks: [logpilot-network]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Logstash: logs.raw -> grok per source -> logs.parsed + Elasticsearch logs-*
  # ----------------------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.11.0}
    container_name: logpilot-logstash
    profiles: [full, lite]
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms512m -Xmx512m}
      KAFKA_BOOTSTRAP: kafka:9092
      ES_HOSTS: http://elasticsearch:9200
      LS_CONSUMER_THREADS: ${LS_CONSUMER_THREADS:-2}
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_ECS_COMPATIBILITY: disabled
    mem_limit: ${LOGSTASH_MEM_LIMIT:-1g}
    volumes:
      - ./ingestion/logstash/pipelines:/usr/share/logstash/pipeline:ro
      - ./ingestion/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    networks: [logpilot-network]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      es-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9600/_node/pipelines || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # One-shot init: Kibana data view + dashboards (storage/kibana/dashboards.ndjson)
  # ----------------------------------------------------------------------------
  kibana-init:
    image: curlimages/curl:8.5.0
    container_name: logpilot-kibana-init
    profiles: [full, lite]
    entrypoint: ["sh", "/setup/setup.sh"]
    environment:
      KIBANA_URL: http://kibana:5601
    volumes:
      - ./storage/kibana:/setup:ro
    networks: [logpilot-network]
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"

  # ----------------------------------------------------------------------------
  # Copilot: Elastic's chatbot-rag-app adapted (Flask API + React UI, one image)
  # LLM = Groq through its OpenAI-compatible endpoint.
  # ----------------------------------------------------------------------------
  copilot:
    build: ./copilot
    image: logpilot-copilot
    container_name: logpilot-copilot
    profiles: [full, lite]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_INDEX: logs-*
      ES_INDEX_CHAT_HISTORY: chat-history
      KIBANA_PUBLIC_URL: http://localhost:${KIBANA_PORT:-5601}
      LLM_TYPE: openai
      OPENAI_BASE_URL: https://api.groq.com/openai/v1
      OPENAI_API_KEY: ${GROQ_API_KEY:-}
      CHAT_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      PYTHONUNBUFFERED: "1"
    mem_limit: ${COPILOT_MEM_LIMIT:-640m}
    ports:
      - "127.0.0.1:${COPILOT_PORT:-4000}:4000"
    networks: [logpilot-network]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Spark: streaming detector (default command) and batch jobs (docker compose run)
  #   docker compose run --rm spark spark-submit /app/batch/train_templates.py
  # ----------------------------------------------------------------------------
  spark:
    build: ./processing
    image: logpilot-spark
    container_name: logpilot-spark
    profiles: [full, lite]
    command: ["spark-submit", "--driver-memory", "${SPARK_DRIVER_MEMORY:-1g}", "/app/streaming/detect.py"]
    environment:
      PATH: /opt/spark/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPARK_CHECKPOINT_DIR: /state/checkpoints
      SPARK_WINDOW_DURATION: ${SPARK_WINDOW_DURATION:-1 minute}
      SPARK_WATERMARK_DURATION: ${SPARK_WATERMARK_DURATION:-2 minutes}
      ANOMALY_ZSCORE_THRESHOLD: ${ANOMALY_ZSCORE_THRESHOLD:-3.0}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-earliest}
    mem_limit: ${SPARK_MEM_LIMIT:-2g}
    volumes:
      - ./processing:/app:ro
      - ./data/loghub:/data:ro
      - sparkstate:/state
      - ./evaluation/results:/results
    networks: [logpilot-network]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Demo shop: api-gateway -> orders -> payments, inventory (one image, one file)
  # Logs to ./logs/shop/<service>.log; failures flipped by sources/chaos/chaos.py
  #   docker compose exec api-gateway python /app/chaos/chaos.py payment-outage
  # ----------------------------------------------------------------------------
  api-gateway: &shop
    build: ./sources/shop
    image: logpilot-shop
    container_name: logpilot-api-gateway
    profiles: [full, lite]
    command: ["python", "/app/shop/app.py", "api-gateway"]
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    mem_limit: 128m
    volumes:
      - ./sources:/app:ro
      - ./logs/shop:/logs/shop
      - ./evaluation/results:/results
    networks: [logpilot-network]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  orders:
    <<: *shop
    container_name: logpilot-orders
    command: ["python", "/app/shop/app.py", "orders"]

  payments:
    <<: *shop
    container_name: logpilot-payments
    command: ["python", "/app/shop/app.py", "payments"]

  inventory:
    <<: *shop
    container_name: logpilot-inventory
    command: ["python", "/app/shop/app.py", "inventory"]

  # Locust: steady simulated customers against the gateway (headless)
  loadgen:
    image: locustio/locust:2.31.8
    container_name: logpilot-loadgen
    profiles: [full, lite]
    command: ["-f", "/mnt/locustfile.py", "--headless", "--only-summary",
              "-u", "${SHOP_USERS:-10}", "-r", "2", "--host", "http://api-gateway:8000"]
    mem_limit: 256m
    volumes:
      - ./sources/loadgen:/mnt:ro
    networks: [logpilot-network]
    depends_on: [api-gateway]
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Incident manager: Kafka anomalies -> incidents (Redis + incidents.events)
  # ----------------------------------------------------------------------------
  incident-manager:
    build: ./services/incident_manager
    image: logpilot-incident-manager
    container_name: logpilot-incident-manager
    profiles: [full, lite]
    command: ["python", "/app/manager.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INCIDENT_MERGE_SECONDS: ${INCIDENT_MERGE_SECONDS:-300}
      INCIDENT_QUIET_SECONDS: ${INCIDENT_QUIET_SECONDS:-180}
    mem_limit: 128m
    volumes:
      - ./services/incident_manager:/app:ro
    networks: [logpilot-network]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
