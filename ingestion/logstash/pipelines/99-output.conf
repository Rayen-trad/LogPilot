output {
  # Parsed stream for Spark and the RAG indexer, keyed by service (per-service ordering).
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP:kafka:9092}"
    topic_id => "logs.parsed"
    message_key => "%{service}"
    codec => json
    compression_type => "lz4"
  }
  # Searchable archive; daily index by event time, idempotent doc ID.
  elasticsearch {
    hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
    index => "logs-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][doc_id]}"
    action => "index"
  }
}
