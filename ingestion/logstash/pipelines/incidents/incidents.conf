# Incident manager events -> Elasticsearch incidents (one doc per incident, latest state wins).
input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP:kafka:9092}"
    topics => ["incidents.events"]
    group_id => "logstash-incidents"
    auto_offset_reset => "earliest"
    codec => json
  }
}
filter {
  date { match => ["opened_at", "ISO8601"] }
  mutate { remove_field => ["@version", "event", "last_anomaly_ts"] }
}
output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
    index => "incidents"
    document_id => "%{incident_id}"
  }
}
