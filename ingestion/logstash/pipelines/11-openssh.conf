# OpenSSH: Dec 10 06:55:46 LabSZ sshd[24200]: Invalid user webmaster from 173.234.31.186
filter {
  if [fields][source] == "openssh" {
    grok {
      match => { "message" => "^%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:hostname} %{DATA:component}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_message}" }
    }
    date { match => ["ts", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] timezone => "UTC" }
    # syslog lines carry no level; derive one so error-ratio rules work.
    # ponytail: keyword heuristic, replace with a template->level map once Drain templates exist.
    if [log_message] =~ /(?i)(error|fatal)/ {
      mutate { add_field => { "level" => "ERROR" } }
    } else if [log_message] =~ /(?i)(fail|invalid|break-in|refused|disconnect)/ {
      mutate { add_field => { "level" => "WARN" } }
    } else {
      mutate { add_field => { "level" => "INFO" } }
    }
    mutate { add_field => { "service" => "openssh" } }
  }
}
