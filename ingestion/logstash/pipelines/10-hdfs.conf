# HDFS: 081109 203518 143 INFO dfs.DataNode$DataXceiver: Receiving block blk_-160... src: ...
filter {
  if [fields][source] == "hdfs" {
    grok {
      match => { "message" => "^(?<ts>\d{6} \d{6}) %{INT:pid} %{LOGLEVEL:level} %{DATA:component}: %{GREEDYDATA:log_message}" }
    }
    date { match => ["ts", "yyMMdd HHmmss"] timezone => "UTC" }
    # block_id is the HDFS_v1 label key, needed for the accuracy evaluation.
    grok {
      match => { "log_message" => "(?<block_id>blk_-?\d+)" }
      tag_on_failure => []
    }
    mutate { add_field => { "service" => "hdfs" } }
  }
}
