# Spark's windowed counts -> Elasticsearch metrics-windows.
# Spark re-emits a window as its count grows (update mode); the fixed doc ID keeps the latest.
input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP:kafka:9092}"
    topics => ["metrics.windows"]
    group_id => "logstash-metrics"
    auto_offset_reset => "earliest"
    codec => json
  }
}
filter {
  date { match => ["window_start", "ISO8601"] }
  fingerprint {
    source => ["service", "template_id", "level", "window_start"]
    concatenate_sources => true
    method => "SHA1"
    target => "[@metadata][doc_id]"
  }
  mutate { remove_field => ["@version", "event"] }
}
output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://elasticsearch:9200}"]
    index => "metrics-windows"
    document_id => "%{[@metadata][doc_id]}"
  }
}
