# Shared normalization for every source.
filter {
  mutate {
    uppercase => ["level"]
    rename => { "[fields][source]" => "source" }
  }
  translate {
    source => "level"
    target => "level"
    override => true
    dictionary => { "WARNING" => "WARN" "NOTICE" => "INFO" "CRIT" => "ERROR" "EMERG" => "FATAL" "ALERT" => "ERROR" }
    fallback => "%{level}"
  }
  if "_grokparsefailure" in [tags] {
    mutate { replace => { "level" => "UNKNOWN" } add_field => { "log_message" => "%{message}" } }
  }

  # Deterministic ID: same file + offset + line => same doc, so replays overwrite, never duplicate.
  fingerprint {
    source => ["[log][file][path]", "[log][offset]", "message"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][doc_id]"
  }

  mutate {
    remove_field => ["ts", "agent", "ecs", "input", "fields", "host", "event", "@version"]
  }
}
