# Logstash concatenates every *.conf in this folder (in name order; digits sort before letters, so keep the NN- prefixes) into one pipeline:
# 00-input -> per-source filters (hdfs/openssh/apache/shop) -> 90-common -> 99-output.

input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP:kafka:9092}"
    topics => ["logs.raw"]
    group_id => "logstash"
    consumer_threads => "${LS_CONSUMER_THREADS:2}"
    auto_offset_reset => "earliest"
    codec => json
  }
}

filter {
  # Filebeat's @timestamp = when it read the line. Save it before the per-source
  # date filters overwrite @timestamp with event time; used for freshness measurement.
  mutate { copy => { "@timestamp" => "shipped_at" } }
}
