# Apache error log: [Thu Jun 09 06:07:04 2005] [notice] LDAP: Built with OpenLDAP LDAP SDK
filter {
  if [fields][source] == "apache" {
    grok {
      match => { "message" => "^\[(?<ts>[^\]]+)\] \[%{WORD:level}\] %{GREEDYDATA:log_message}" }
    }
    date { match => ["ts", "EEE MMM dd HH:mm:ss yyyy", "EEE MMM  d HH:mm:ss yyyy"] timezone => "UTC" locale => "en" }
    mutate { add_field => { "service" => "apache" } }
  }
}
